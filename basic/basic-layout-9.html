<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 9</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      body {
        display: grid;
        grid-gap: 1em;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }
      header {
        grid-column: 1 / 2;
        grid-row: 1;
      }
      nav {   
        grid-column: 2 / 5;
        grid-row: 1;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
      }
      main {
        grid-column: 1 / -1;
        grid-row: 2 / 4;
      }
      footer {
        grid-column: 1 / -1
      }
    </style>
  </head>
  <body id="basic-layout-9">
    <header><h1>Basic Layout 9</h1></header>
    <nav>
      <button><a href="#">Home</a></button>
      <button><a href="#">Over ons</a></button>
      <button><a href="#">Contact</a></button>
    </nav>
    <main><a href="../index.html">Terug naar het overzicht</a></main>
    <footer></footer>
  </body>
</html>
